<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request status</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1f2937; background: #f8fafc; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; }
    h1 { font-size: 1.3rem; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 10px 12px; font-size: 16px; border: 1px solid #e5e7eb; border-radius: 8px; }
    button { padding: 10px 18px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: .5; }
    dl dt { color: #6b7280; font-size: .8rem; margin-top: 12px; }
    dl dd { margin: 2px 0 0; font-weight: 600; }
    .status-pill { display: inline-block; padding: 4px 12px; border-radius: 999px; background: #eff6ff; color: #1e40af; font-weight: 600; }
    .err { color: #991b1b; margin-top: 12px; }
    .auto { color: #6b7280; font-size: .8rem; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Check request status</h1>
    <p>Enter the request ID shown after submitting the form.</p>
    <div class="row">
      <input id="rid" placeholder="Request ID" inputmode="numeric">
      <button id="go">Check</button>
    </div>
    <div id="out"></div>
    <label class="auto"><input type="checkbox" id="auto"> Auto-refresh every 10s (handy while an approver acts during the demo)</label>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let timer = null;

    async function check() {
      const id = $('rid').value.trim();
      if (!id) return;
      $('go').disabled = true;
      try {
        const res = await fetch('/api/request-status?requestId=' + encodeURIComponent(id));
        const d = await res.json();
        if (!res.ok) { $('out').innerHTML = `<p class="err">${d.error}</p>`; return; }
        $('out').innerHTML = `
          <dl>
            <dt>Status</dt><dd><span class="status-pill">${esc(d.status || 'Unknown')}</span></dd>
            <dt>Detail</dt><dd>${esc(d.detail || '—')}</dd>
            <dt>Request type</dt><dd>${esc(d.type || '—')}</dd>
            <dt>Requested for</dt><dd>${esc(d.requestedFor || '—')}</dd>
            <dt>Current approver</dt><dd>${esc(d.assignee || '—')}</dd>
            <dt>Submitted</dt><dd>${esc(d.submittedOn || '—')}</dd>
          </dl>
          <p class="auto">Updated ${new Date().toLocaleTimeString()}</p>`;
      } catch (err) {
        $('out').innerHTML = `<p class="err">${err.message}</p>`;
      } finally {
        $('go').disabled = false;
      }
    }
    function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    const preset = new URLSearchParams(location.search).get('requestId');
    if (preset) { $('rid').value = preset; check(); }

    $('go').addEventListener('click', check);
    $('rid').addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });
    $('auto').addEventListener('change', (e) => {
      clearInterval(timer);
      if (e.target.checked) timer = setInterval(check, 10000);
    });
  </script>
</body>
</html>
