<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Request</title>
  <style>
    :root {
      --primary: #2563eb; --primary-text: #fff; --accent: #1e40af;
      --bg: #f8fafc; --surface: #fff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
    .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    header img { max-height: 44px; max-width: 180px; }
    h1 { font-size: 1.4rem; margin: 0; }
    .tagline { color: var(--muted); margin: 4px 0 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .steps { display: flex; gap: 8px; margin-bottom: 20px; }
    .steps div { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
    .steps div.active { background: var(--primary); }
    label { display: block; font-weight: 600; margin: 16px 0 6px; font-size: .9rem; }
    .help { font-weight: 400; color: var(--muted); font-size: .8rem; margin: 2px 0 6px; }
    input, select { width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text); }
    input:focus, select:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
    .actions { display: flex; justify-content: space-between; margin-top: 24px; gap: 12px; }
    button { padding: 10px 20px; font-size: 15px; border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--text); cursor: pointer; }
    button.primary { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
    button.primary:hover { background: var(--accent); border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .intro { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
    .review dt { color: var(--muted); font-size: .8rem; margin-top: 12px; }
    .review dd { margin: 2px 0 0; font-weight: 600; }
    .banner { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: .9rem; display: none; }
    .banner.error { background: #fef2f2; color: #991b1b; display: block; }
    .banner.info { background: #eff6ff; color: #1e40af; display: block; }
    .success { text-align: center; padding: 16px 0; }
    .success .check { font-size: 48px; color: var(--primary); }
    .reqid { font-family: ui-monospace, monospace; font-size: 1.2rem; background: var(--bg); padding: 6px 12px; border-radius: 6px; display: inline-block; margin-top: 8px; }
    .hidden { display: none; }
    footer { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 20px; }
    a { color: var(--primary); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img id="logo" alt="" class="hidden">
      <div><h1 id="product">Access Request</h1></div>
    </header>
    <p class="tagline" id="tagline"></p>

    <div class="card">
      <div class="steps"><div class="active"></div><div></div><div></div></div>
      <div class="banner" id="banner"></div>

      <section id="step-0">
        <p class="intro" id="intro"></p>
        <label for="org">Organization</label>
        <div class="help">Loaded live from Saviynt.</div>
        <select id="org" disabled><option>Loading organizations…</option></select>
        <div class="help" id="org-detail"></div>
        <div class="actions"><span></span><button class="primary" id="to-1" disabled>Next</button></div>
      </section>

      <section id="step-1" class="hidden">
        <div id="fields"></div>
        <div class="actions"><button id="back-0">Back</button><button class="primary" id="to-2">Review</button></div>
      </section>

      <section id="step-2" class="hidden">
        <dl class="review" id="review"></dl>
        <div class="actions"><button id="back-1">Back</button><button class="primary" id="submit">Submit request</button></div>
      </section>

      <section id="step-done" class="hidden">
        <div class="success">
          <div class="check">✓</div>
          <p id="success-msg"></p>
          <div id="reqid-wrap" class="hidden">Request ID<br><span class="reqid" id="reqid"></span></div>
          <p><a id="status-link" href="#" target="_blank">Check request status</a></p>
          <div class="actions" style="justify-content:center"><button id="again">Submit another</button></div>
        </div>
      </section>
    </div>
    <footer>Powered by Saviynt</footer>
  </div>
  <script src="/form.js"></script>
</body>
</html>
