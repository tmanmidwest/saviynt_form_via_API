<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saviynt Forms</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #1f2937; background: #f8fafc; }
    h1 { font-size: 1.5rem; }
    .muted { color: #6b7280; }
    ul { list-style: none; padding: 0; }
    li a { display: block; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 12px; text-decoration: none; color: inherit; }
    li a:hover { border-color: #2563eb; }
    .name { font-weight: 600; }
    .admin { margin-top: 24px; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <h1>Saviynt request forms</h1>
  <p class="muted">Published forms:</p>
  <ul id="list"><li class="muted">Loading…</li></ul>
  <p class="admin">Manage forms and the Saviynt connection in the <a href="/admin">admin console</a>.</p>

  <script>
    function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
    fetch('/api/forms').then((r) => r.json()).then((d) => {
      const list = document.getElementById('list');
      if (!d.forms.length) { list.innerHTML = '<li class="muted">No published forms yet. Create one in the admin console.</li>'; return; }
      list.innerHTML = d.forms.map((f) =>
        `<li><a href="/f/${encodeURIComponent(f.id)}"><span class="name">${esc(f.productName || f.name)}</span><br><span class="muted">${esc(f.tagline || '')}</span></a></li>`
      ).join('');
    }).catch(() => { document.getElementById('list').innerHTML = '<li class="muted">Could not load forms.</li>'; });
  </script>
</body>
</html>
