services:
  forms:
    build: .
    ports:
      # Host port is configurable to avoid clashes with other containers; the
      # app always listens on 3000 inside the container.
      - "${PORT:-3000}:3000"
    environment:
      # Admin console login (change these).
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # Set MOCK_MODE=true to run without a Saviynt tenant.
      MOCK_MODE: ${MOCK_MODE:-false}
    volumes:
      # Named volume so the Saviynt connection and forms set in the admin UI
      # survive redeploys and "Force recreate".
      - forms-data:/data
    restart: unless-stopped

volumes:
  forms-data:
